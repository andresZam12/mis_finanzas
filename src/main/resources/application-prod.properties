# ==========================================================
# Perfil de produccion — Render + Neon
# Todas las variables sensibles vienen del dashboard de Render
# ==========================================================

spring.application.name=finanzas

server.port=${PORT:8081}

# Neon PostgreSQL — formato: jdbc:postgresql://host/dbname?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

logging.level.org.springframework.security=WARN
logging.level.com.ucc.finanzas=INFO
