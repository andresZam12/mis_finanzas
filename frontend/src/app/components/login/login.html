<div class="login-page">

  <img src="/logo.png" alt="MI$ FINANZAS" class="login-logo" />

  <div class="login-card">
    <div class="login-header">
      <h1>Inicia sesión</h1>
      <p>Bienvenido de vuelta</p>
    </div>

    @if (error) {
      <div class="alerta alerta-error">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="enviar()">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" formControlName="username" placeholder="Tu usuario" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="Tu contraseña" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary login-btn" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="login-footer">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>
  </div>

</div>
