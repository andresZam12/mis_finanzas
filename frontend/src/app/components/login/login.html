<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <span class="login-icon">💰</span>
      <h1>Finanzas Personales</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    @if (error) {
      <div class="alerta alerta-error">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="enviar()">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" formControlName="username" placeholder="Tu usuario" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="Tu contraseña" />
      </div>
      <button type="submit" class="btn btn-primary login-btn" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:0.9rem">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>
  </div>
</div>
