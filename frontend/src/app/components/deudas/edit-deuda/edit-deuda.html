<div class="page">
  <div class="page-header">
    <h2>✏️ Editar Deuda</h2>
    <a routerLink="/deudas" class="btn btn-secondary">← Volver</a>
  </div>

  <div class="card" style="max-width:480px">
    @if (error) { <div class="alerta alerta-error">{{ error }}</div> }

    <form [formGroup]="form" (ngSubmit)="enviar()">
      <div class="form-group">
        <label>Persona</label>
        <input type="text" formControlName="persona" />
      </div>
      <div class="form-group">
        <label>Monto ($)</label>
        <input type="number" formControlName="monto" min="1" />
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" formControlName="descripcion" />
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select formControlName="tipo">
          <option value="YO_DEBO">Yo debo</option>
          <option value="ME_DEBEN">Me deben</option>
        </select>
      </div>
      <div class="toggle-group">
        <label class="toggle-row">
          <input type="checkbox" formControlName="recurrente" />
          <span>Deuda recurrente</span>
        </label>
        <small class="form-hint">Se regenerará automáticamente cada mes al pagarla</small>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </form>
  </div>
</div>
