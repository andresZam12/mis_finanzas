<div class="page">
  <div class="page-header">
    <h2>✏️ Editar {{ tipo === 'ingreso' ? 'Ingreso' : 'Gasto' }}</h2>
    <a [routerLink]="tipo === 'ingreso' ? '/movimientos/ingresos' : '/movimientos/gastos'" class="btn btn-secondary">← Volver</a>
  </div>

  <div class="card" style="max-width:480px">
    @if (error) { <div class="alerta alerta-error">{{ error }}</div> }

    <form [formGroup]="form" (ngSubmit)="enviar()">
      <div class="form-group">
        <label>Monto ($)</label>
        <input type="number" formControlName="monto" min="1" />
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" formControlName="descripcion" />
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select formControlName="categoriaId">
          <option value="">— Seleccionar —</option>
          @for (c of categorias; track c.id) {
            <option [value]="c.id">{{ c.nombre }}</option>
          }
        </select>
      </div>
      @if (esIngreso) {
        <div class="form-group">
          <label>Fuente</label>
          <input type="text" formControlName="fuente" placeholder="Ej: Salario, Freelance" />
        </div>
      }

      <div class="form-group">
        <label>Tipo de pago</label>
        <select formControlName="tipoPago">
          <option value="">-- Selecciona --</option>
          <option value="EFECTIVO">Efectivo</option>
          <option value="TARJETA">Tarjeta</option>
          <option value="TRANSFERENCIA">Transferencia</option>
          <option value="OTRO">Otro</option>
        </select>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" formControlName="esRecurrente" id="recurrente" style="width:auto" />
        <label for="recurrente" style="margin:0">¿Es recurrente?</label>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </form>
  </div>
</div>
