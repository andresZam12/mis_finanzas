<div class="page">
  <div class="page-header">
    <h2>{{ esIngreso ? '📈 Nuevo Ingreso' : '📉 Nuevo Gasto' }}</h2>
    <a [routerLink]="esIngreso ? '/movimientos/ingresos' : '/movimientos/gastos'" class="btn btn-secondary">← Volver</a>
  </div>

  <div class="card" style="max-width:520px">
    @if (error) { <div class="alerta alerta-error">{{ error }}</div> }

    <form [formGroup]="form" (ngSubmit)="enviar()">
      <div class="form-group">
        <label>Monto ($)</label>
        <input type="number" formControlName="monto" placeholder="0" min="1" />
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" formControlName="descripcion" placeholder="Descripción breve..." />
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select formControlName="categoriaId">
          <option value="">-- Selecciona categoría --</option>
          @for (cat of categorias; track cat.id) {
            <option [value]="cat.id">{{ cat.nombre }}</option>
          }
        </select>
      </div>

      @if (esIngreso) {
        <div class="form-group">
          <label>% Ahorro (0 = sin ahorro)</label>
          <input type="number" formControlName="porcentajeAhorro" placeholder="0" min="0" max="100" />
          <small style="color:#64748b;font-size:0.8rem">Si ingresas un porcentaje, se registrará automáticamente en tus ahorros.</small>
        </div>
      }

      <div class="form-group">
        <label>Tipo de pago</label>
        <select formControlName="tipoPago">
          <option value="">-- Selecciona --</option>
          <option value="EFECTIVO">Efectivo</option>
          <option value="TARJETA">Tarjeta</option>
          <option value="TRANSFERENCIA">Transferencia</option>
          <option value="OTRO">Otro</option>
        </select>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="esRecurrente" />
          Es recurrente mensual
        </label>
      </div>

      <button type="submit" class="btn" [class.btn-success]="esIngreso" [class.btn-danger]="!esIngreso" [disabled]="form.invalid || cargando">
        {{ cargando ? 'Guardando...' : (esIngreso ? 'Registrar ingreso' : 'Registrar gasto') }}
      </button>
    </form>
  </div>
</div>
